{% extends 'interfaz/base.html' %}

{% block content %}
<div class="col-md-6 mx-auto">
    <div class="card">
        <div class="card-header">
            <h4 class="mb-0">Eliminar Cliente</h4>
        </div>
        <div class="card-body">
            <p>¿Seguro que deseas eliminar al cliente {{ cliente.nombre }} {{ cliente.apellidos }}?</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Eliminar</button>
                <a href="{% url 'lista_clientes' %}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
