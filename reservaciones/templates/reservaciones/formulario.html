{% extends 'interfaz/base.html' %}

{% block content %}
<div class="col-md-6 mx-auto">
    <div class="card">
        <div class="card-header">
            <h4 class="mb-0">{{ titulo }}</h4>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-hotel">Guardar</button>
                <a href="{% url 'lista_reservaciones' %}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
